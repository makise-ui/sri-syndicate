<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5940" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="#ecfdf5" stroke="#15803d" stroke-width="4"/>
  
  <!-- Curving text path reference -->
  <path id="textPathTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
  <path id="textPathBottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none" />
  
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0d5940" letter-spacing="2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      MFRS. OF COTTON SAREES
    </textPath>
  </text>
  
  <text font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d" letter-spacing="3">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ERODE • ESTD
    </textPath>
  </text>

  <!-- Inner Blue Oval -->
  <circle cx="100" cy="100" r="54" fill="url(#blueGrad)" stroke="#84cc16" stroke-width="3.5" />
  
  <!-- Stylized SS Monogram -->
  <text x="100" y="114" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    SS
  </text>
</svg>
